<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Renzo Costa</title>
    <link rel="stylesheet" href="styles.css">

    <!-- ICONOS (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- BARRA SUPERIOR -->
<div class="top-bar">
    ENVÍOS GRATIS POR PEDIDOS SUPERIORES A S/349
</div>

<!-- HEADER -->
<header class="header">

    <!-- FILA SUPERIOR -->
    <div class="header-top">

        <!-- BUSCADOR -->
       <div class="left">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="¿Qué estás buscando?">
    </div>
</div>

        <!-- LOGO -->
        <div class="logo">
            Renzo Costa
        </div>

        <!-- ICONOS DERECHA -->
        <div class="icons">
            <i class="fa-brands fa-whatsapp"></i>
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-cart-shopping"></i>
        </div>

    </div>

    <!-- MENÚ (ABAJO) -->
    <nav class="menu">
        <ul>
            <li>LO NUEVO</li>
            <li>HOMBRE</li>
            <li>MUJER</li>
            <li>SERVICIOS</li>
            <li>OUTLET</li>
            <li>VENTA EXCLUSIVA</li>
        </ul>
    </nav>

</header>

<!-- HERO -->
<section class="hero">
    <div class="overlay">
        <h1>CUERO EN TODO MOMENTO</h1>
        <p>ENCUENTRA TU FAVORITO</p>

        <div class="buttons">
            <button>VER HOMBRE</button>
            <button>VER MUJER</button>
        </div>
    </div>
</section>

<!-- BOTÓN WHATSAPP FLOTANTE -->
<a href="#" class="whatsapp">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<script src="script.js"></script>
</body>
</html>
