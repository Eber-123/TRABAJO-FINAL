<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renzo Costa </title>
    <link rel="stylesheet" href="styles3.css">
    <script src="https://kit.fontawesome.com/eb43306d9b.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="promo-bar">
        ENVÍO GRATIS POR COMPRAS MAYORES A S/ 299
    </div>

    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="https://vectorseek.com/wp-content/uploads/2023/07/Renzo-Costa-Logo-Vector.svg-.png" alt="Renzo Costa">
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="#">HOMBRE</a></li>
                    <li><a href="#">MUJER</a></li>
                    <li><a href="#">BILLETERAS</a></li>
                    <li><a href="servicios.html">SERVICIOS</a></li>
                    <li><a href="#">OUTLET</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-user"></i>
                <div class="cart-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>


    <section class="hero">
        <video autoplay muted loop playsinline id="hero-video-bg">
            <source src="https://www.renzocosta.com/api/dataentities/VD/documents/2f0aef34-3b2d-4795-8c28-64cdf6dfe70f/name/attachments/SV%20Desktop.mp4" type="video/mp4">
            Tu navegador no soporta video.
        </video>

        <div class="hero-content">
            <h1>NUEVA COLECCIÓN</h1>
            <button class="btn-shop">VER MÁS</button>
        </div>
   </section>

    

    <section class="products-section">
        <h2>LO MÁS VENDIDO</h2>
        <div class="product-grid">
            <div class="card">
                <img src="https://renzocosta.vteximg.com.br/arquivos/ids/323456/billetera-cuero.jpg" alt="Billetera">
                <p class="category">Billeteras</p>
                <h3>Billetera de Cuero Clásica</h3>
                <p class="price">S/ 189.00</p>
                <button class="add-to-cart">Añadir al Carrito</button>
            </div>
            <div class="card">
                <img src="https://renzocosta.vteximg.com.br/arquivos/ids/323457/cartera-cuero.jpg" alt="Cartera">
                <p class="category">Carteras</p>
                <h3>Cartera de Cuero Premium</h3>
                <p class="price">S/ 549.00</p>
                <button class="add-to-cart">Añadir al Carrito</button>
            </div>
        </div>
    </section>

    <script src="script3.js"></script>
</body>
</html>
